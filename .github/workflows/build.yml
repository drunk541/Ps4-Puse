name: PS4-Puse Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld make curl

      - name: Download OpenOrbis Toolchain
        run: |
          curl -fsSL https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz | tar -xz -C "$GITHUB_WORKSPACE"
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"
          echo "GOLDHEN_SDK=$GITHUB_WORKSPACE/vendor/GoldHEN_Plugins_SDK" >> "$GITHUB_ENV"

      - name: Build PS4 plugin
        run: |
          make clean
          make

      - name: Verify PRX
        run: |
          find bin/plugins -type f -name "*.prx"
          test -n "$(find bin/plugins/prx_final -type f -name '*.prx' -print -quit)"

      - name: Upload PRX
        uses: actions/upload-artifact@v4
        with:
          name: PS4-Puse-PRX
          path: bin/plugins/prx_final/*.prx
          if-no-files-found: error
