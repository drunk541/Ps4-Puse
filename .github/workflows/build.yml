name: PS4-Puse Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenOrbis
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:v0.5.1 \
            bash -lc '
              echo "PS4-Puse environment ready"
              clang --version
              echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN"
            '
