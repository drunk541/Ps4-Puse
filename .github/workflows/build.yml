name: PS4-Puse Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build environment
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.1
          command: |
            echo "PS4-Puse build environment ready"
            clang --version
            echo "$OO_PS4_TOOLCHAIN"
